; ============================================================================
; IMPROVED WHEELS PLUS - SETTINGS
; Close the game before editing. Restart to apply changes.
; Controller shortcuts use the button numbers listed below.
; Keyboard shortcuts use key names. NONE = unbound.
; Gameplay wheel: L3 / D-pad left = previous; R3 / D-pad right = next.
; ============================================================================


; ============================================================================
[Wheel]
; ============================================================================

; --- SLOW MOTION ---

; Slow motion while a gameplay wheel is open. 1 = on, 0 = off.
bSlowTime=1

; Game speed during slow motion: 1-99%. 10 = one tenth of normal speed.
uSlowTimePercent=10

; --- WHEEL BEHAVIOR ---

; Items or spells per Inventory/Magic slot: 1-16. Ammo uses one arrow type per slot.
uEntriesPerSlot=5


; Keep the Inventory wheel open after using an item. 1 = yes, 0 = close.
bStayOpenAfterUse=1

; Reopen the last wheel. 1 = yes, 0 = always start on Inventory.
bRememberWheel=1

; Prevent dropping or selling favorites. 1 = prevent, 0 = allow.
bBlockFavouriteDropSell=0

; Only change this if your wheels come up empty after loading a save or restarting the game.
; Name the wheel files after the player name only (UI_UserInputText_3_386_2.iwp / .spells) instead of the save's
; character id. 1 = player name, 0 = character id. Characters that share a player name then share their wheels.
bSavingByPlayerName=0

; --- SELECTION AND RELEASE ---

; Use the pointed slot when the wheel closes. 1 = yes, 0 = use A/RB only.
bChooseOnClose=1

; Skip empty slots when pointing with the stick. 1 = yes, 0 = no.
bPointFilledOnly=0

; Clear the pointed slot when the stick returns to center. 1 = yes, 0 = no.
bCentreRestSnap=1

; Wait this many milliseconds before clearing the pointed slot: 30-1000.
uRestSnapMs=400

; --- ANIMATION AND SLOT COUNTERS ---

; Slot counter: 0 = current entry / saved entries, 1 = current entry / slot capacity.
bShowSlotCapacity=0

; --- CONTROLLER BINDS - GAMEPLAY WHEELS ---
; Button numbers: 0 = disabled; 1 = D-pad up; 2 = down; 4 = left; 8 = right;
; 16 = Start; 32 = Select/Back; 64 = L3; 128 = R3; 256 = LB; 512 = RB;
; 4096 = A; 8192 = B; 16384 = X; 32768 = Y.

; Main gameplay wheel button. Match the wheel button in the game Controls menu.
uWheelButton=256

; Inventory wheel shortcut. Hold to open it directly. 0 = disabled.
uEquipmentWheelButton=0

; Magic wheel shortcut. Hold to open it directly. 0 = disabled.
uMagicWheelButton=0

; Ammo wheel shortcut. Hold to open it directly. 0 = disabled.
uAmmoWheelButton=0


; ============================================================================
[Controller]
; ============================================================================

; --- CONTROLLER BINDS - INVENTORY AND MAGIC MENUS ---

; Favorite/unfavorite the highlighted item or spell in a menu. 0 = disabled.
uFavouriteButton=32



; ============================================================================
[AmmoWheel]
; ============================================================================

; --- AMMO WHEEL APPEARANCE ---

; Enable the Ammo wheel. 1 = on, 0 = off.
bEnabled=1

; Ammo shortcut layout: 0 = right-edge half wheel, 1 = centered full wheel.
; The edge layout becomes a full wheel above five arrow types.
uPosition=1

; --- CONTROLLER BIND - DEDICATED AMMO SHORTCUT ---

; Dedicated Ammo wheel shortcut. Press to open; press again or A to equip. B cancels.
; Point with the right stick or D-pad up/down. 0 = shortcut disabled.
uButton=0


; ============================================================================
[Keyboard]
; ============================================================================

; --- KEYBOARD SUPPORT ---

; Enable keyboard and mouse controls, with or without a controller. 1 = on, 0 = off.
bKeyboardSupport=1


; Use the slot shortcuts below instead of the game's number-key shortcuts. 1 = yes, 0 = no.
bReplaceQuickKeys=1

; --- KEYBOARD BINDS - OPEN AND USE THE GAMEPLAY WHEEL ---

; Wheel key behavior: 1 = press to open/close, 0 = hold to open.
bWheelToggle=1

; Open/close the gameplay wheel.
sLB=R

; Use the pointed slot.
sRB=BACKSLASH

; Previous entry in the pointed slot.
sLT=Z

; Next entry in the pointed slot.
sRT=C

; Mouse button for the next entry in the gameplay wheel.
sNextEntryMouse=RBUTTON

; --- KEYBOARD BINDS - SWITCH WHEELS ---

; Previous wheel.
sDpadLeft=Q

; Next wheel.
sDpadRight=E

; Virtual D-pad up. NONE = unbound.
sDpadUp=NONE

; Virtual D-pad down. NONE = unbound.
sDpadDown=NONE

; --- KEYBOARD BINDS - FAVORITES AND ASSIGNMENT ---

; Favorite/unfavorite the highlighted menu item or spell.
sSelect=F

; Virtual L3. R already opens the menu assignment panel through the game.
sL3=NONE

; Hold to clear the pointed assignment slot.
sX=X

; --- KEYBOARD BINDS - DIRECT WHEEL SHORTCUTS ---

; Inventory wheel shortcut. Hold to open it directly.
sEquipmentWheel=F6

; Magic wheel shortcut. Hold to open it directly.
sMagicWheel=F7

; Ammo wheel shortcut. Hold to open it directly.
sAmmoWheel=F8

; --- KEYBOARD BINDS - DIRECT SLOT SHORTCUTS ---

; Slot shortcuts 1-8, separated by commas. In gameplay: use the slot.
; In Inventory/Magic: assign the highlighted item or spell to the slot.
sSlotKeys=NUMPAD1,NUMPAD2,NUMPAD3,NUMPAD4,NUMPAD5,NUMPAD6,NUMPAD7,NUMPAD8

; Second set of shortcuts for slots 1-8, separated by commas.
sSlotKeysAlt=1,2,3,4,5,6,7,8

; --- KEYBOARD BINDS - OPTIONAL VIRTUAL CONTROLLER BUTTONS ---

; Virtual A button. NONE = unbound.
sA=NONE

; Virtual Y button. NONE = unbound.
sY=NONE

; Virtual R3 button. NONE = unbound.
sR3=NONE

; Virtual Start button. NONE = unbound.
sStart=NONE

; --- KEYBOARD BINDS - OPTIONAL STICK DIRECTIONS ---

; Point up on the wheel. NONE = use the mouse.
sStickUp=NONE

; Point down on the wheel. NONE = use the mouse.
sStickDown=NONE

; Point left on the wheel. NONE = use the mouse.
sStickLeft=NONE

; Point right on the wheel. NONE = use the mouse.
sStickRight=NONE


; ============================================================================
[Display]
; ============================================================================

; --- WHEEL GEOMETRY ---

; UI scale: 0 = automatic. Otherwise enter a percentage, such as 133.
uUiScalePercent=0

; Slot distance from the wheel center, as a percentage of the wheel half-width.
uCellRingPercent=71

; Mouse click radius around each slot, using the same percentage scale.
uCellHitPercent=24

; --- SLOT COUNTERS ---

; Slot counter text size, in percent.
uCountTextPercent=60

; Distance below each slot for its counter, using the wheel half-width percentage.
uCountBelowPercent=11

; --- MAGIC WHEEL CENTER TEXT ---

; Magic wheel center text size, in percent.
uCentreTextPercent=70

; Characters per line before the center text wraps.
uCentreLineChars=26


; ============================================================================
[Theme]
; ============================================================================

; --- WHEEL THEMES ---

; Blue Magic wheel theme. 1 = on, 0 = original game look.
bMagicWheel=1

; Red Inventory wheel theme. 1 = on, 0 = original game look.
bInventoryWheel=1


; ============================================================================
[Log]
; ============================================================================

; --- LOGGING ---

; Logging: 0 = trace, 1 = debug, 2 = info, 3 = warnings, 4 = errors.
; Keep 3 for normal play. Use 1 or 2 when collecting a bug report.
; Log: Documents\My Games\Oblivion Remastered\OBSE\Logs\ImprovedWheelMenu.log
uLogLevel=3
